<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architect-Prospector AI</title>
    <meta name="description" content="Sistema autônomo de prospecção dual (B2B Empresas & Imóveis de Particulares FSBO) com Idealista, OLX, Fotocasa, ZAP, Apollo.io, Google Maps, Lotes de pesquisa, ICP Score, scripts SDR e quebra de objeções." />
    <meta property="og:title" content="Architect-Prospector AI" />
    <meta property="og:description" content="Sistema autônomo de prospecção dual (B2B Empresas & Imóveis de Particulares FSBO) com Idealista, OLX, Fotocasa, ZAP, Apollo.io, Google Maps, Lotes de pesquisa, ICP Score, scripts SDR e quebra de objeções." />
    <script>
      // Polyfill / Fix for "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If already defined or cannot redefine, continue safely
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
      
      html, body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        letter-spacing: -0.011em;
      }

      /* Melhoria de legibilidade de rótulos e elementos compactos */
      button, input, select, textarea {
        font-family: inherit;
        letter-spacing: inherit;
      }
    </style>
    <script>
      // Diagnostic overlay: surfaces ANY critical runtime/module error instead of a white screen
      (function () {
        function show(msg) {
          try {
            // Ignore benign fetch getter error or harmless extension errors
            if (msg.includes('Cannot set property fetch of') || msg.includes('ResizeObserver loop') || msg.includes('failed to connect to websocket')) {
              return;
            }
            var el = document.getElementById('__err-overlay');
            if (!el) {
              el = document.createElement('div');
              el.id = '__err-overlay';
              el.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:999999;background:#881337;border:1px solid #f43f5e;border-radius:12px;color:#fff;font:12px/1.5 monospace;padding:12px 16px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;max-height:40vh;overflow:auto;';
              
              var content = document.createElement('div');
              content.id = '__err-overlay-text';
              content.style.cssText = 'flex:1;white-space:pre-wrap;';
              
              var closeBtn = document.createElement('button');
              closeBtn.textContent = '✕ Fechar';
              closeBtn.style.cssText = 'background:rgba(255,255,255,0.2);border:none;color:#fff;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:bold;shrink:0;';
              closeBtn.onclick = function() { el.style.display = 'none'; };
              
              el.appendChild(content);
              el.appendChild(closeBtn);
              document.body && document.body.appendChild(el);
            }
            var textEl = document.getElementById('__err-overlay-text') || el;
            textEl.textContent = '[Aviso do app] ' + msg;
            el.style.display = 'flex';
          } catch (e) {}
        }
        window.addEventListener('error', function (e) {
          show((e.message || (e.error && e.error.stack) || 'Erro desconhecido').toString());
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('Promise rejeitada: ' + (r && (r.message || r.stack || r)) + '');
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
